<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        {% block title %}Civic Vision AI{% endblock %}

    </title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/dashboard.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/animation.css') }}">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">

<div class="container-fluid">

<a class="navbar-brand fw-bold">

<i class="fa-solid fa-city"></i>

Civic Vision AI

</a>

<button
class="navbar-toggler"
type="button"
data-bs-toggle="collapse"
data-bs-target="#navbarNav">

<span class="navbar-toggler-icon"></span>

</button>

<div
class="collapse navbar-collapse"
id="navbarNav">

<ul class="navbar-nav ms-auto align-items-center">

<li class="nav-item">

<a
class="nav-link"
href="/">

<i class="fa-solid fa-house"></i>

Home

</a>

</li>

<li class="nav-item">

<a
class="nav-link"
href="/track">

<i class="fa-solid fa-location-dot"></i>

Track Complaint

</a>

</li>

<li class="nav-item">

<a
class="nav-link"
href="/analytics">

<i class="fa-solid fa-chart-line"></i>

Analytics

</a>

</li>

<li class="nav-item">

<a
class="nav-link"
href="/map">

<i class="fa-solid fa-map-location-dot"></i>

Map

</a>

</li>

<li class="nav-item ms-3">

<span class="badge bg-primary p-2">

{{ session.get('username','Guest') }}

</span>

</li>

<li class="nav-item ms-2">

<a
class="btn btn-danger"

href="/logout">

Logout

</a>

</li>

</ul>

</div>

</div>

</nav>

<div class="container mt-4">

{% block content %}

{% endblock %}

</div>

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">

</script>

<script
src="{{ url_for('static', filename='js/upload.js') }}">

</script>

<script
src="{{ url_for('static', filename='js/prediction.js') }}">

</script>

<script
src="{{ url_for('static', filename='js/dashboard.js') }}">

</script>

</body>

</html>
