<!DOCTYPE html>
<html>
<head>

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .card{

            width:420px;

            margin:auto;

            margin-top:80px;

            padding:25px;

            border-radius:15px;

            box-shadow:0 0 15px rgba(0,0,0,.2);

        }

    </style>

</head>

<body>

<div class="card">

    <h3 class="text-center mb-4">

        User Login

    </h3>

    <form method="POST">

        <div class="mb-3">

            <label>Email</label>

            <input
                type="email"
                name="email"
                class="form-control"
                required>

        </div>

        <div class="mb-3">

            <label>Password</label>

            <input
                type="password"
                name="password"
                class="form-control"
                required>

        </div>

        <button class="btn btn-primary w-100">

            Login

        </button>

    </form>

    <div class="text-center mt-3">

        Don't have an account?

        <a href="/register">

            Register

        </a>

    </div>

</div>

</body>
</html>
