<!DOCTYPE html>
<html>
<head>
    <title>Urban Issue Detection</title>

    <!-- Bootstrap (for modern UI) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }
        .card {
            max-width: 400px;
            margin: auto;
            margin-top: 80px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        img {
            max-width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="card text-center">
    <h4>🚧 Urban Issue Detection</h4>

    <input type="file" id="fileInput" class="form-control mt-3">

    <img id="preview" />

    <button class="btn btn-primary mt-3" onclick="upload()">Predict</button>

    <div id="loading" class="mt-3" style="display:none;">
        ⏳ Detecting...
    </div>

    <div id="result" class="mt-3"></div>
</div>

<script>
function upload() {
    let file = document.getElementById("fileInput").files[0];
    let formData = new FormData();
    formData.append("file", file);

    // Show preview
    document.getElementById("preview").src = URL.createObjectURL(file);

    // Show loading
    document.getElementById("loading").style.display = "block";
    document.getElementById("result").innerHTML = "";

    fetch("/predict", {
    method: "POST",
    body: formData
})
.then(async (res) => {

    const data = await res.json();

    if (!res.ok || !data.success) {
        throw new Error(data.message);
    }

    return data;
})
.then(data => {

    loading.style.display = "none";

    let color = data.prediction === "Unknown" ? "red" : "green";

    document.getElementById("result").innerHTML = `
        <b style="color:${color}">
            ${data.prediction} (${data.confidence}%)
        </b>
        <br><br>
        <b>Reference ID:</b> ${data.reference_id}
    `;

})
.catch(error => {

    loading.style.display = "none";

    alert(error.message);

    console.error(error);

});
}
</script>

</body>
</html>
